_target_: src.data_modules.BaseDM

# UNPAIRED
# clean data: VCTK
# degraded data: CHiME6

defaults:
  - /datasets@trainset.degraded_dataset: chime6_train
  - /datasets@valset.degraded_dataset: chime6_test
  - /datasets@testset.degraded_dataset: chime6_test
  - /datasets@trainset.clean_dataset: vctk_train
  - /datasets@valset.clean_dataset: vctk_test
  - /datasets@testset.clean_dataset: vctk_test

batch_size: 4
num_workers: 4
pin_memory: True
persistent_workers: True

trainset:
  _target_: src.datasets.UnpairedAudioDataset
  x0_key: waveform
  x1_key: waveform
  x1_clean_key: None
  deterministic: False
  paired: False

valset:
  _target_: src.datasets.UnpairedAudioDataset
  x0_key: waveform
  x1_key: waveform
  x1_clean_key: None
  deterministic: True
  paired: False

testset:
  _target_: src.datasets.UnpairedAudioDataset
  x0_key: waveform
  x1_key: waveform
  x1_clean_key: None
  deterministic: True
  paired: False
