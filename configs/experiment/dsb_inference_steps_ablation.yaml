# @package _global_

defaults:
  - dsb
  - override /data: reverb_unpaired
  - override /callbacks: test_metrics

phase: 'test'

project_name: 'ablation tests'
task_name: 'dsb inference steps ablation'

num_steps: 50

logger:
  log_model: False

data:
  batch_size: 10

model:
  pretraining_steps: 25_000
  inference_steps: 20
  scheduler:
    epsilon: 0.1
  model:
    num_blocks: 5

trainer:
  limit_test_batches: 100
  max_steps: 50_000
  val_check_interval: 1.0
