# @package _global_

# Experiment configuration for training OneStepModel with DriftingLoss on WHAM environmental noise
defaults:
  - override /trainer: gpu
  - override /data: noise_paired
  - override /callbacks: onestep
  - override /model: onestep
  - override /networks@model.model: mamba2
  - override /losses@model.loss_fn: feature_matching
  - override /logger: default


project_name: 'denoising'
task_name: 'drifting paired onestep'
compile: True
phase: 'train'

train_audio_length: 16000
test_audio_length: 48000
sample_rate: 16000

model:
  sigma: [0.0, 0.1]

data:
  batch_size: 32
  num_workers: 16

logger:
  log_model: True

trainer:
  max_steps: 200_000
  log_every_n_steps: 100
  max_epochs: -1
  limit_val_batches: 1000
  val_check_interval: "00:00:45:00"
